name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore Acme.All.slnx

      - run: dotnet build Acme.All.slnx --no-restore

      # No services block, and none needed: the repository tests start their own Postgres through
      # Testcontainers, and the runner has Docker. Everything above the repository is tested with an
      # in-memory one instead, which is the point of keeping the logic out of it.
      - run: dotnet test Acme.All.slnx --no-build --verbosity normal
